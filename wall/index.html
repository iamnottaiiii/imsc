<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>the globe — for all my followers</title>
<meta name="description" content="A globe holding every follower's name. Find yours.">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    position: fixed; inset: 0; overflow: hidden;
    background: #b3a996;
    font-family: 'Permanent Marker', cursive;
    color: #2b2b2b;
  }
  #stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
  #stage:active { cursor: grabbing; }
  #stage canvas { display: block; }
  header {
    position: fixed; top: 0; left: 0; z-index: 30;
    padding: 16px 18px 0;
    pointer-events: none;
    text-shadow: 0 1px 0 rgba(255,255,255,.28);
    transition: opacity .5s ease;
  }
  header.gone { opacity: 0; }
  header.gone .searchrow, header.gone .cta { pointer-events: none; }
  header h1 { margin: 0; font-size: 34px; line-height: 1; }
  header .sub { margin: 4px 0 0; font-size: 17px; color: #4a4438; }
  header .searchrow { display: flex; gap: 8px; margin-top: 8px; max-width: 340px; pointer-events: auto; }
  #q {
    flex: 1; font-family: inherit; font-size: 19px; min-width: 0;
    background: transparent; border: none;
    border-bottom: 3px solid #2b2b2b;
    padding: 2px; color: #2b2b2b; outline: none;
  }
  #q::placeholder { color: #7a7365; }
  #go {
    font-family: inherit; font-size: 19px; cursor: pointer;
    background: #2b2b2b; color: #b3a996;
    border: none; padding: 4px 14px;
    transform: rotate(-1.5deg);
  }
  #msg { min-height: 24px; font-size: 16px; margin-top: 4px; color: #8a3d2e; max-width: 340px; }
  header .cta { margin: 2px 0 0; font-size: 15px; color: #4a4438; pointer-events: auto; }
  header .cta a { color: #2b2b2b; }
  #hint {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) rotate(-1deg);
    z-index: 30; font-size: 18px; color: #4a4438; pointer-events: none;
    text-shadow: 0 1px 0 rgba(255,255,255,.28);
    transition: opacity 1s ease; white-space: nowrap;
  }
  #loading {
    position: fixed; inset: 0; z-index: 40; display: flex;
    align-items: center; justify-content: center;
    font-size: 26px; background: #b3a996;
  }
  #fallback {
    position: fixed; inset: 0; z-index: 50; display: none;
    align-items: center; justify-content: center; text-align: center;
    font-size: 22px; padding: 30px; background: #b3a996;
  }
</style>
</head>
<body>
<div id="stage"></div>
<header>
  <h1>the globe</h1>
  <p class="sub">I made a globe for all my followers. <span id="count">…</span> names so far.</p>
  <div class="searchrow">
    <input id="q" type="text" placeholder="find your name" autocomplete="off" spellcheck="false">
    <button id="go">find</button>
  </div>
  <div id="msg"></div>
  <p class="cta">follow <a href="https://www.instagram.com/idk_cool_i_guess/">@idk_cool_i_guess</a> and your name gets added to the globe.</p>
</header>
<div id="hint">drag to spin around &middot; drag up and down &middot; pinch to zoom</div>
<div id="loading">painting the wall&hellip;</div>
<div id="fallback"><p>this wall needs WebGL.<br>try a newer browser.</p></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const COLORS = ["#2b2b2b","#2b2b2b","#2b2b2b","#2b2b2b","#9a4a3a","#4a6e6e"];
const R = 30;                       // globe radius
const CIRC = 2 * Math.PI * R;
const MARGIN = 4, ROW_GAP = 2.6, COL_GAP = 2.0;
const WALL_COLOR = 0xb3a996;

function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry(seed){let s=seed>>>0;return function(){s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;};}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

let renderer, scene, camera, maxAniso=4;
const nameIndex=new Map();
let view=0.6, camY=0, fov=60;       // view = wall angle looked at (wraps forever)
let viewTarget=null, yTarget=null, fovTarget=null;
let dragging=false, viewVel=0, yVel=0;
let spotlight=null, glowSprite=null;
let topY=8, botY=-200;
const stage=document.getElementById('stage');
const headerEl=document.querySelector('header');
const v3=new THREE.Vector3();

boot().catch(()=>{document.getElementById('fallback').style.display='flex';document.getElementById('loading').style.display='none';});

async function boot(){
  await document.fonts.load('48px "Permanent Marker"');
  await document.fonts.ready;
  const users=await (await fetch('followers.json')).json();
  document.getElementById('count').textContent=users.length;

  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.75));
  renderer.setSize(innerWidth,innerHeight);
  stage.appendChild(renderer.domElement);
  maxAniso=renderer.capabilities.getMaxAnisotropy();

  scene=new THREE.Scene();
  scene.background=new THREE.Color(WALL_COLOR);
  scene.fog=new THREE.Fog(WALL_COLOR,R*2.4,R*6);
  fov=(innerWidth/innerHeight)<0.8?70:58;
  camera=new THREE.PerspectiveCamera(fov,innerWidth/innerHeight,0.1,600);

  buildWorld(users);
  setupControls();
  setupSearch();
  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
  document.getElementById('loading').style.display='none';
  setTimeout(()=>{document.getElementById('hint').style.opacity='0';},7000);
  renderer.setAnimationLoop(tick);
}

/* seamless warm concrete */
function concreteTexture(){
  const S=512, c=document.createElement('canvas');c.width=c.height=S;
  const g=c.getContext('2d'),r=mulberry(7);
  g.fillStyle='#b3a996';g.fillRect(0,0,S,S);
  const blob=(x,y,rad,dark)=>{
    for(const ox of [-S,0,S])for(const oy of [-S,0,S]){
      const gr=g.createRadialGradient(x+ox,y+oy,0,x+ox,y+oy,rad);
      gr.addColorStop(0,dark?'rgba(128,114,96,0.08)':'rgba(222,212,190,0.08)');
      gr.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gr;g.beginPath();g.arc(x+ox,y+oy,rad,0,7);g.fill();
    }
  };
  for(let i=0;i<30;i++)blob(r()*S,r()*S,40+r()*140,r()<0.6);
  for(let i=0;i<5200;i++){
    const x=r()*S,y=r()*S;
    g.fillStyle=r()<0.5?'rgba(70,62,52,0.06)':'rgba(236,229,213,0.06)';
    for(const ox of [-S,0,S])for(const oy of [-S,0,S])g.fillRect(x+ox,y+oy,1.5,1.5);
  }
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.anisotropy=maxAniso;t.colorSpace=THREE.SRGBColorSpace;
  return t;
}

const measureCtx=document.createElement('canvas').getContext('2d');
function nameTexture(text,color){
  measureCtx.font='48px "Permanent Marker"';
  const w=Math.ceil(measureCtx.measureText(text).width);
  const c=document.createElement('canvas');
  c.width=w+30;c.height=78;
  const g=c.getContext('2d');
  g.font='48px "Permanent Marker"';
  g.fillStyle=color;g.textBaseline='alphabetic';
  g.fillText(text,15,56);
  const t=new THREE.CanvasTexture(c);
  t.anisotropy=maxAniso;t.colorSpace=THREE.SRGBColorSpace;
  return {tex:t,aspect:c.width/c.height};
}

function wallText(text,color,worldH){
  const {tex,aspect}=nameTexture(text,color);
  const m=new THREE.Mesh(
    new THREE.PlaneGeometry(worldH*aspect,worldH),
    new THREE.MeshBasicMaterial({map:tex,transparent:true})
  );
  return m;
}
function placeOnWall(mesh,theta,y){
  const rr=R-0.4;
  mesh.position.set(rr*Math.sin(theta),y,rr*Math.cos(theta));
  mesh.lookAt(0,y,0);
  scene.add(mesh);
  return mesh;
}

function buildWorld(users){
  const conc=concreteTexture();
  // pack names in rows around the globe; new names only add rows below
  let x=MARGIN, y=topY, rowH=0;
  users.forEach((u,i)=>{
    const r=mulberry(hashStr(u.username+':'+i));
    const color=COLORS[Math.floor(r()*COLORS.length)];
    const hWorld=2.5+r()*1.1;
    measureCtx.font='48px "Permanent Marker"';
    const tw=measureCtx.measureText('@'+u.username).width+30;
    const wWorld=hWorld*(tw/78);
    if(x+wWorld>CIRC-MARGIN&&x>MARGIN){y-=(rowH+ROW_GAP);x=MARGIN;rowH=0;}
    const theta=(x+wWorld/2)/R+(r()-0.5)*0.9/R;
    const yy=y+(r()-0.5)*0.8;
    const m=wallText('@'+u.username,color,hWorld);
    placeOnWall(m,theta,yy);
    m.rotateZ((r()-0.5)*0.10);
    nameIndex.set(u.username.toLowerCase(),{mesh:m,theta,y:yy});
    x+=wWorld+COL_GAP;rowH=Math.max(rowH,hWorld);
  });
  botY=y-rowH-16;
  const H=topY-botY;

  conc.repeat.set(8,Math.max(1,Math.round(H/24)));
  const globe=new THREE.Mesh(
    new THREE.CylinderGeometry(R,R,H,96,1,true),
    new THREE.MeshBasicMaterial({map:conc,side:THREE.BackSide})
  );
  globe.position.y=(topY+botY)/2;
  scene.add(globe);

  const title=wallText('the globe','#2b2b2b',5);
  placeOnWall(title,0.55,topY-4);title.rotateZ(-0.02);

  const cta1=wallText('follow @idk_cool_i_guess','#2b2b2b',3.4);
  placeOnWall(cta1,0.55,botY+9);cta1.rotateZ(0.015);
  const cta2=wallText('get your name on the globe','#9a4a3a',3.0);
  placeOnWall(cta2,0.55,botY+5);cta2.rotateZ(-0.02);

  camY=topY-11;view=0.55;
}

function setupControls(){
  const el=renderer.domElement;
  const pts=new Map();let lastPinch=0;
  el.addEventListener('pointerdown',e=>{
    el.setPointerCapture(e.pointerId);
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    viewTarget=null;dragging=true;viewVel=0;yVel=0;clearSpot();
  });
  el.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId))return;
    const p=pts.get(e.pointerId);
    const dx=e.clientX-p.x,dy=e.clientY-p.y;
    p.x=e.clientX;p.y=e.clientY;
    if(pts.size===1){
      viewTarget=null;yTarget=null;
      viewVel=-dx*0.0052;yVel=dy*0.08;   // flick to keep spinning / traveling
      view+=viewVel;                       // spin around the globe (wraps forever)
      camY=clamp(camY+yVel,botY+8,topY+2);
    }else if(pts.size===2){
      const a=[...pts.values()];
      const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
      if(lastPinch>0){fovTarget=clamp((fovTarget??fov)*lastPinch/d,38,80);}
      lastPinch=d;
    }
  });
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2)lastPinch=0;if(pts.size===0)dragging=false;};
  el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',up);
  el.addEventListener('wheel',e=>{
    e.preventDefault();fovTarget=clamp((fovTarget??fov)*Math.pow(1.0016,e.deltaY),38,80);
  },{passive:false});
}

function setupSearch(){
  const input=document.getElementById('q');
  const msg=document.getElementById('msg');
  const go=()=>{
    const q=input.value.trim().replace(/^@/,'').toLowerCase();
    clearSpot();
    if(!q){msg.textContent='';return;}
    const e=nameIndex.get(q);
    if(!e){msg.textContent='not on the globe yet. follow @idk_cool_i_guess to be added.';return;}
    msg.textContent='';
    spotlight=e;
    viewVel=0;yVel=0;
    let d=((e.theta-view+Math.PI*3)%(Math.PI*2))-Math.PI;   // shortest spin
    viewTarget=view+d;yTarget=e.y;fovTarget=55;
    if(!glowSprite){
      const c=document.createElement('canvas');c.width=c.height=256;
      const g=c.getContext('2d');
      const gr=g.createRadialGradient(128,128,8,128,128,128);
      gr.addColorStop(0,'rgba(255,250,230,0.9)');
      gr.addColorStop(0.35,'rgba(255,244,210,0.4)');
      gr.addColorStop(1,'rgba(255,244,210,0)');
      g.fillStyle=gr;g.fillRect(0,0,256,256);
      const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
      glowSprite=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
      scene.add(glowSprite);
    }
    glowSprite.visible=true;
    const rr=(R-0.15)/R;   // light sits behind the name, haloing it without covering it
    glowSprite.position.set(e.mesh.position.x*rr,e.mesh.position.y,e.mesh.position.z*rr);
    glowSprite.scale.set(8,9.5,1);
  };
  document.getElementById('go').addEventListener('click',go);
  input.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  input.addEventListener('input',()=>{if(!input.value)clearSpot();});
  addEventListener('keydown',e=>{if(e.key==='Escape')clearSpot();});
}
function clearSpot(){
  spotlight=null;
  if(glowSprite)glowSprite.visible=false;
}

const clock=new THREE.Clock();
function tick(){
  const t=clock.getElapsedTime();
  if(viewTarget!==null){
    view+=(viewTarget-view)*0.085;
    if(Math.abs(viewTarget-view)<0.002)viewTarget=null;
  }
  if(yTarget!==null){
    camY+=(yTarget-camY)*0.085;
    if(Math.abs(yTarget-camY)<0.05)yTarget=null;
  }
  if(fovTarget!==null){
    fov+=(fovTarget-fov)*0.12;
    camera.fov=fov;camera.updateProjectionMatrix();
    if(Math.abs(fovTarget-fov)<0.1)fovTarget=null;
  }
  if(!dragging&&viewTarget===null){          // flick momentum after release
    if(Math.abs(viewVel)>0.0002){view+=viewVel;viewVel*=0.94;}
    if(Math.abs(yVel)>0.005){
      const ny=clamp(camY+yVel,botY+8,topY+2);
      if(ny!==camY){camY=ny;yVel*=0.94;}else yVel=0;
    }
  }
  headerEl.classList.toggle('gone',camY<topY-26);
  camera.position.set(0,camY,0);
  camera.rotation.set(0,view+Math.PI,0);
  if(spotlight&&glowSprite){
    const p=1+Math.sin(t*4.5)*0.06;
    glowSprite.scale.set(8*p,9.5*p,1);
  }
  renderer.render(scene,camera);
}
</script>
</body>
</html>
