<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>the globe — for all my followers</title>
<meta name="description" content="A globe holding every follower's name. Find yours.">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    position: fixed; inset: 0; overflow: hidden;
    background: #b3a996;
    font-family: 'Permanent Marker', cursive;
    color: #2b2b2b;
  }
  #stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
  #stage:active { cursor: grabbing; }
  #stage canvas { display: block; }
  header {
    position: fixed; top: 0; left: 0; z-index: 30;
    padding: 16px 18px 0;
    pointer-events: none;
    text-shadow: 0 1px 0 rgba(255,255,255,.28);
    transition: opacity .5s ease;
  }
  header.gone { opacity: 0; }
  header.gone .searchrow, header.gone .cta { pointer-events: none; }
  header h1 { margin: 0; font-size: 34px; line-height: 1; }
  header .sub { margin: 4px 0 0; font-size: 17px; color: #4a4438; }
  header .searchrow { display: flex; gap: 8px; margin-top: 8px; max-width: 340px; pointer-events: auto; }
  #q {
    flex: 1; font-family: inherit; font-size: 19px; min-width: 0;
    background: transparent; border: none;
    border-bottom: 3px solid #2b2b2b;
    padding: 2px; color: #2b2b2b; outline: none;
  }
  #q::placeholder { color: #7a7365; }
  #go {
    font-family: inherit; font-size: 19px; cursor: pointer;
    background: #2b2b2b; color: #b3a996;
    border: none; padding: 4px 14px;
    transform: rotate(-1.5deg);
  }
  #msg { min-height: 24px; font-size: 16px; margin-top: 4px; color: #8a3d2e; max-width: 340px; }
  header .cta { margin: 2px 0 0; font-size: 15px; color: #4a4438; pointer-events: auto; }
  header .cta a { color: #2b2b2b; }
  #hint {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) rotate(-1deg);
    z-index: 30; font-size: 18px; color: #4a4438; pointer-events: none;
    text-shadow: 0 1px 0 rgba(255,255,255,.28);
    transition: opacity 1s ease; white-space: nowrap;
  }
  #loading {
    position: fixed; inset: 0; z-index: 40; display: flex;
    align-items: center; justify-content: center;
    font-size: 26px; background: #b3a996;
  }
  #fallback {
    position: fixed; inset: 0; z-index: 50; display: none;
    align-items: center; justify-content: center; text-align: center;
    font-size: 22px; padding: 30px; background: #b3a996;
  }
</style>
</head>
<body>
<div id="stage"></div>
<header>
  <h1>the globe</h1>
  <p class="sub">I made a globe for all my followers. <span id="count">…</span> names so far.</p>
  <div class="searchrow">
    <input id="q" type="text" placeholder="find your name" autocomplete="off" spellcheck="false">
    <button id="go">find</button>
  </div>
  <div id="msg"></div>
  <p class="cta">follow <a href="https://www.instagram.com/idk_cool_i_guess/">@idk_cool_i_guess</a> and your name gets added to the globe.</p>
</header>
<div id="hint">drag to look around &middot; pinch to zoom</div>
<div id="loading">painting the globe&hellip;</div>
<div id="fallback"><p>this globe needs WebGL.<br>try a newer browser.</p></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const COLORS = ["#2b2b2b","#2b2b2b","#2b2b2b","#2b2b2b","#9a4a3a","#4a6e6e"];
const R = 42;                 // globe radius (look is angular; you're at the center)
const SLOTS = 768;            // fibonacci slots for names; new names take the next free slot
const WALL_COLOR = 0xb3a996;
const UP = new THREE.Vector3(0,1,0);

function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry(seed){let s=seed>>>0;return function(){s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;};}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

let renderer, scene, camera, maxAniso=4;
const nameIndex=new Map();
let yaw=0, pitch=0, fov=60;   // look direction; yaw wraps forever
let yawTarget=null, pitchTarget=null, fovTarget=null;
let dragging=false, yawVel=0, pitchVel=0;
let spotlight=null, glowSprite=null;
const homeDir=new THREE.Vector3(0,0,1);
const stage=document.getElementById('stage');
const headerEl=document.querySelector('header');
const _vd=new THREE.Vector3();

boot().catch(()=>{document.getElementById('fallback').style.display='flex';document.getElementById('loading').style.display='none';});

async function boot(){
  await document.fonts.load('48px "Permanent Marker"');
  await document.fonts.ready;
  const users=await (await fetch('followers.json')).json();
  document.getElementById('count').textContent=users.length;

  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.75));
  renderer.setSize(innerWidth,innerHeight);
  stage.appendChild(renderer.domElement);
  maxAniso=renderer.capabilities.getMaxAnisotropy();

  scene=new THREE.Scene();
  scene.background=new THREE.Color(WALL_COLOR);
  fov=(innerWidth/innerHeight)<0.8?66:58;
  camera=new THREE.PerspectiveCamera(fov,innerWidth/innerHeight,0.1,600);
  camera.rotation.order='YXZ';
  camera.position.set(0,0,0);

  buildWorld(users);
  setupControls();
  setupSearch();
  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
  document.getElementById('loading').style.display='none';
  setTimeout(()=>{document.getElementById('hint').style.opacity='0';},7000);
  renderer.setAnimationLoop(tick);
}

/* even points on a sphere; index i is always the same direction (new names append) */
function fibDir(i,n){
  const ga=Math.PI*(3-Math.sqrt(5));
  const y=1-((i+0.5)/n)*2;
  const rad=Math.sqrt(Math.max(0,1-y*y));
  const th=ga*i;
  return new THREE.Vector3(Math.cos(th)*rad,y,Math.sin(th)*rad);
}

/* seamless warm concrete */
function concreteTexture(){
  const S=512, c=document.createElement('canvas');c.width=c.height=S;
  const g=c.getContext('2d'),r=mulberry(7);
  g.fillStyle='#b3a996';g.fillRect(0,0,S,S);
  const blob=(x,y,rad,dark)=>{
    for(const ox of [-S,0,S])for(const oy of [-S,0,S]){
      const gr=g.createRadialGradient(x+ox,y+oy,0,x+ox,y+oy,rad);
      gr.addColorStop(0,dark?'rgba(128,114,96,0.08)':'rgba(222,212,190,0.08)');
      gr.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gr;g.beginPath();g.arc(x+ox,y+oy,rad,0,7);g.fill();
    }
  };
  for(let i=0;i<30;i++)blob(r()*S,r()*S,40+r()*140,r()<0.6);
  for(let i=0;i<5200;i++){
    const x=r()*S,y=r()*S;
    g.fillStyle=r()<0.5?'rgba(70,62,52,0.06)':'rgba(236,229,213,0.06)';
    for(const ox of [-S,0,S])for(const oy of [-S,0,S])g.fillRect(x+ox,y+oy,1.5,1.5);
  }
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.anisotropy=maxAniso;t.colorSpace=THREE.SRGBColorSpace;
  return t;
}

const measureCtx=document.createElement('canvas').getContext('2d');
function nameTexture(text,color){
  measureCtx.font='48px "Permanent Marker"';
  const w=Math.ceil(measureCtx.measureText(text).width);
  const c=document.createElement('canvas');
  c.width=w+30;c.height=78;
  const g=c.getContext('2d');
  g.font='48px "Permanent Marker"';
  g.fillStyle=color;g.textBaseline='alphabetic';
  g.fillText(text,15,56);
  const t=new THREE.CanvasTexture(c);
  t.anisotropy=maxAniso;t.colorSpace=THREE.SRGBColorSpace;
  return {tex:t,aspect:c.width/c.height};
}

/* name patch curved to hug the globe, readable from the center */
function curvedName(text,color,worldH){
  const {tex,aspect}=nameTexture(text,color);
  const wWorld=worldH*aspect;
  const segs=Math.max(8,Math.round(wWorld*2));
  const geo=new THREE.PlaneGeometry(wWorld,worldH,segs,1);
  const pos=geo.attributes.position;
  const rn=R-0.4;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),y=pos.getY(i);
    const th=x/rn;
    pos.setXYZ(i,rn*Math.sin(th),y,rn*Math.cos(th));
  }
  geo.computeVertexNormals();
  const mesh=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide}));
  return {mesh,wWorld};
}

const _x=new THREE.Vector3(),_y=new THREE.Vector3(),_z=new THREE.Vector3(),_m4=new THREE.Matrix4();
function placeOnSphere(mesh,dir,roll){
  _z.copy(dir).normalize();
  _x.crossVectors(UP,_z);
  if(_x.lengthSq()<1e-6)_x.set(1,0,0);else _x.normalize();
  _y.crossVectors(_z,_x).normalize();
  _m4.makeBasis(_x,_y,_z);
  mesh.quaternion.setFromRotationMatrix(_m4);
  mesh.position.copy(_z).multiplyScalar(R-0.4);
  mesh.rotateZ(roll);
  scene.add(mesh);
}

function buildWorld(users){
  const conc=concreteTexture();
  conc.repeat.set(8,4);
  scene.add(new THREE.Mesh(
    new THREE.SphereGeometry(R,72,48),
    new THREE.MeshBasicMaterial({map:conc,side:THREE.BackSide})
  ));

  const titleDir=new THREE.Vector3(0.45,0.10,1).normalize();
  const ctaDir=new THREE.Vector3(-0.5,-0.30,1).normalize();
  const ctaDir2=ctaDir.clone().add(new THREE.Vector3(0,-0.10,0)).normalize();
  const reserved=[titleDir,ctaDir,ctaDir2];

  let s=0;
  users.forEach((u,i)=>{
    let d;
    for(;;){
      d=fibDir(s%SLOTS,SLOTS);s++;
      if(s>SLOTS*2||reserved.every(rd=>d.angleTo(rd)>=0.24))break;
    }
    const r=mulberry(hashStr(u.username+':'+i));
    const color=COLORS[Math.floor(r()*COLORS.length)];
    measureCtx.font='48px "Permanent Marker"';
    const aspect=(measureCtx.measureText('@'+u.username).width+30)/78;
    let worldH=(0.055+r()*0.015)*R;
    const maxW=0.10*R;
    if(worldH*aspect>maxW)worldH=worldH*maxW/(worldH*aspect);
    const {mesh}=curvedName('@'+u.username,color,worldH);
    placeOnSphere(mesh,d,(r()-0.5)*0.10);
    nameIndex.set(u.username.toLowerCase(),{dir:d.clone()});
  });

  const title=curvedName('the globe','#2b2b2b',0.11*R).mesh;
  placeOnSphere(title,titleDir,-0.02);
  const cta1=curvedName('follow @idk_cool_i_guess','#2b2b2b',0.06*R).mesh;
  placeOnSphere(cta1,ctaDir,0.015);
  const cta2=curvedName('get your name on the globe','#9a4a3a',0.055*R).mesh;
  placeOnSphere(cta2,ctaDir2,-0.02);

  yaw=Math.atan2(-titleDir.x,-titleDir.z);
  pitch=Math.asin(clamp(titleDir.y,-1,1));
  homeDir.copy(titleDir);
}

function setupControls(){
  const el=renderer.domElement;
  const pts=new Map();let lastPinch=0;
  el.addEventListener('pointerdown',e=>{
    el.setPointerCapture(e.pointerId);
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    yawTarget=null;pitchTarget=null;dragging=true;yawVel=0;pitchVel=0;clearSpot();
  });
  el.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId))return;
    const p=pts.get(e.pointerId);
    const dx=e.clientX-p.x,dy=e.clientY-p.y;
    p.x=e.clientX;p.y=e.clientY;
    if(pts.size===1){
      yawTarget=null;pitchTarget=null;
      yawVel=dx*0.005;pitchVel=dy*0.005;   // flick to keep looking around
      yaw+=yawVel;
      pitch=clamp(pitch+pitchVel,-1.45,1.45);
    }else if(pts.size===2){
      const a=[...pts.values()];
      const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
      if(lastPinch>0){fovTarget=clamp((fovTarget??fov)*lastPinch/d,38,80);}
      lastPinch=d;
    }
  });
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2)lastPinch=0;if(pts.size===0)dragging=false;};
  el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',up);
  el.addEventListener('wheel',e=>{
    e.preventDefault();fovTarget=clamp((fovTarget??fov)*Math.pow(1.0016,e.deltaY),38,80);
  },{passive:false});
}

function setupSearch(){
  const input=document.getElementById('q');
  const msg=document.getElementById('msg');
  const go=()=>{
    const q=input.value.trim().replace(/^@/,'').toLowerCase();
    clearSpot();
    if(!q){msg.textContent='';return;}
    const e=nameIndex.get(q);
    if(!e){msg.textContent='not on the globe yet. follow @idk_cool_i_guess to be added.';return;}
    msg.textContent='';
    spotlight=e;
    yawVel=0;pitchVel=0;
    const d=e.dir;
    const yawT=Math.atan2(-d.x,-d.z);
    const pitchT=Math.asin(clamp(d.y,-1,1));
    yawTarget=yaw+(((yawT-yaw+Math.PI*3)%(Math.PI*2))-Math.PI);  // shortest spin
    pitchTarget=pitchT;fovTarget=55;
    if(!glowSprite){
      const c=document.createElement('canvas');c.width=c.height=256;
      const g=c.getContext('2d');
      const gr=g.createRadialGradient(128,128,8,128,128,128);
      gr.addColorStop(0,'rgba(255,250,230,0.9)');
      gr.addColorStop(0.35,'rgba(255,244,210,0.4)');
      gr.addColorStop(1,'rgba(255,244,210,0)');
      g.fillStyle=gr;g.fillRect(0,0,256,256);
      const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
      glowSprite=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
      scene.add(glowSprite);
    }
    glowSprite.visible=true;
    glowSprite.position.copy(d).multiplyScalar(R-0.15);
    glowSprite.scale.set(6.5,7.5,1);
  };
  document.getElementById('go').addEventListener('click',go);
  input.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  input.addEventListener('input',()=>{if(!input.value)clearSpot();});
  addEventListener('keydown',e=>{if(e.key==='Escape')clearSpot();});
}
function clearSpot(){
  spotlight=null;
  if(glowSprite)glowSprite.visible=false;
}

const clock=new THREE.Clock();
function tick(){
  const t=clock.getElapsedTime();
  if(yawTarget!==null){
    yaw+=(yawTarget-yaw)*0.085;
    if(Math.abs(yawTarget-yaw)<0.002)yawTarget=null;
  }
  if(pitchTarget!==null){
    pitch+=(pitchTarget-pitch)*0.085;
    if(Math.abs(pitchTarget-pitch)<0.002)pitchTarget=null;
  }
  if(fovTarget!==null){
    fov+=(fovTarget-fov)*0.12;
    camera.fov=fov;camera.updateProjectionMatrix();
    if(Math.abs(fovTarget-fov)<0.1)fovTarget=null;
  }
  if(!dragging&&yawTarget===null){
    if(Math.abs(yawVel)>0.0002){yaw+=yawVel;yawVel*=0.94;}
    if(Math.abs(pitchVel)>0.0005){
      const np=clamp(pitch+pitchVel,-1.45,1.45);
      if(np!==pitch){pitch=np;pitchVel*=0.94;}else pitchVel=0;
    }
  }
  camera.rotation.set(pitch,yaw,0);
  // the search ui lives at the entrance view; look away and it gets out of the way
  _vd.set(-Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch));
  headerEl.classList.toggle('gone',_vd.dot(homeDir)<Math.cos(0.6));
  if(spotlight&&glowSprite){
    const p=1+Math.sin(t*4.5)*0.06;
    glowSprite.scale.set(6.5*p,7.5*p,1);
  }
  renderer.render(scene,camera);
}
</script>
</body>
</html>
