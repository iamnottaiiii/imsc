<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>The Globe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; overscroll-behavior:none; }
  body {
    font-family:'Permanent Marker',cursive;
    background:radial-gradient(circle at 50% 38%, #ded4be 0%, #cfc6b4 55%, #bcb198 100%);
  }
  #stage { position:fixed; inset:0; touch-action:none; }
  #stage canvas { display:block; }
  #vignette { position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 58%, rgba(70,58,44,.20) 100%); }
  header {
    position:fixed; top:0; left:0; right:0; z-index:10;
    padding:18px 20px 14px; text-align:center; pointer-events:none;
  }
  header h1 {
    font-size:clamp(30px,6vw,52px); color:#2b2b2b; letter-spacing:1px;
    text-shadow:0 1px 0 rgba(255,255,255,.35); line-height:1;
  }
  header .sub {
    margin-top:6px; font-size:clamp(14px,2.6vw,20px); color:#4a4438;
    text-shadow:0 1px 0 rgba(255,255,255,.3);
  }
  header .searchrow { margin-top:10px; display:flex; gap:8px; justify-content:center; pointer-events:auto; }
  header input {
    font-family:inherit; font-size:16px; padding:8px 14px; width:min(240px,55vw);
    border:2px solid #2b2b2b; border-radius:999px; background:rgba(255,255,255,.78);
    color:#2b2b2b; outline:none; transition:border-color .2s;
  }
  header input::placeholder { color:#8a8172; }
  header input.miss { border-color:#9a4a3a; }
  header button {
    font-family:inherit; font-size:16px; padding:8px 18px; cursor:pointer;
    border:2px solid #2b2b2b; border-radius:999px; background:#2b2b2b; color:#f5efe2;
  }
  header button:active { transform:scale(.96); }
  header .cta {
    margin-top:8px; font-size:clamp(13px,2.4vw,17px); color:#6b5f4c;
    text-shadow:0 1px 0 rgba(255,255,255,.3);
  }
  header .cta b { color:#9a4a3a; }
  #hint {
    position:fixed; bottom:16px; left:0; right:0; z-index:10; text-align:center;
    font-size:14px; color:#6b5f4c; text-shadow:0 1px 0 rgba(255,255,255,.3);
    pointer-events:none;
  }
  #loading {
    position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    background:#cfc6b4; color:#4a4438; font-size:22px;
  }
  #fallback {
    position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center;
    background:#cfc6b4; color:#4a4438; font-size:20px; text-align:center; padding:40px;
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="vignette"></div>
<header>
  <h1>THE GLOBE</h1>
  <div class="sub">I made a globe for all my followers. <span id="count">loading</span> names so far.</div>
  <div class="searchrow">
    <input id="q" type="text" placeholder="find your name" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="go">FIND</button>
  </div>
  <div class="cta">follow <b>@idk_cool_i_guess</b> and your name gets added to the globe.</div>
</header>
<div id="hint">drag to look around &middot; pinch or scroll to zoom</div>
<div id="loading">rolling the globe&hellip;</div>
<div id="fallback">this globe needs WebGL.<br>try opening it in Safari or Chrome.</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

const R = 10;                 // globe radius
const NAME_R = R + 0.18;      // names float just off the surface
const SLOTS = 768;            // fibonacci slots, stable as names are appended
const UP = new THREE.Vector3(0,1,0);
const PITCH_CLAMP = 1.25;
const CAM_MIN = 13, CAM_MAX = 60, CAM_HOME = 32;

/* ---------- deterministic rand ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- concrete texture, poles faded flat so there is no top or seam ---------- */
const BASE = [201,190,168];
function concreteTexture(){
  const S=1024,c=document.createElement('canvas');c.width=c.height=S;
  const g=c.getContext('2d');
  g.fillStyle=`rgb(${BASE[0]},${BASE[1]},${BASE[2]})`;g.fillRect(0,0,S,S);
  const r=mulberry32(7);
  for(let i=0;i<1100;i++){
    const x=r()*S,y=r()*S,rad=20+r()*90,dark=r()>0.5;
    for(const ox of [-S,0,S]){
      const gr=g.createRadialGradient(x+ox,y,0,x+ox,y,rad);
      gr.addColorStop(0,dark?'rgba(128,114,96,0.030)':'rgba(228,218,196,0.030)');
      gr.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gr;g.beginPath();g.arc(x+ox,y,rad,0,7);g.fill();
    }
  }
  // fade detail to flat base near the poles: the globe has no visible top
  const fade=S*0.12;
  let fg=g.createLinearGradient(0,0,0,fade);
  fg.addColorStop(0,`rgba(${BASE[0]},${BASE[1]},${BASE[2]},1)`);
  fg.addColorStop(1,`rgba(${BASE[0]},${BASE[1]},${BASE[2]},0)`);
  g.fillStyle=fg;g.fillRect(0,0,S,fade);
  fg=g.createLinearGradient(0,S,0,S-fade);
  fg.addColorStop(0,`rgba(${BASE[0]},${BASE[1]},${BASE[2]},1)`);
  fg.addColorStop(1,`rgba(${BASE[0]},${BASE[1]},${BASE[2]},0)`);
  g.fillStyle=fg;g.fillRect(0,S-fade,S,fade);
  const tex=new THREE.CanvasTexture(c);
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  tex.repeat.set(6,3);
  tex.colorSpace=THREE.SRGBColorSpace;
  return tex;
}

/* ---------- marker text, curved to sit ON the globe ---------- */
const measureCtx=document.createElement('canvas').getContext('2d');
function nameTexture(text,color){
  const px=64,pad=18;
  measureCtx.font=px+'px "Permanent Marker"';
  const w=Math.ceil(measureCtx.measureText(text).width)+pad*2;
  const h=px+pad*2;
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');
  g.font=px+'px "Permanent Marker"';
  g.textBaseline='middle';
  g.shadowColor='rgba(60,50,38,.35)';g.shadowBlur=3;g.shadowOffsetY=2;
  g.fillStyle=color;
  g.fillText(text,pad,h/2+2);
  const tex=new THREE.CanvasTexture(c);
  tex.colorSpace=THREE.SRGBColorSpace;
  tex.anisotropy=4;
  return {tex,aspect:w/h};
}
function makeName(text,color,worldH){
  const {tex,aspect}=nameTexture(text,color);
  const wWorld=Math.min(worldH*aspect,1.0);   // width cap keeps real gaps
  const h=wWorld/aspect;
  const segs=Math.max(8,Math.round(wWorld*2.5));
  const geo=new THREE.PlaneGeometry(wWorld,h,segs,1);
  const pos=geo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),y=pos.getY(i);
    const th=x/NAME_R;
    pos.setXYZ(i,NAME_R*Math.sin(th),y,NAME_R*(Math.cos(th)-1));
  }
  geo.computeVertexNormals();
  return new THREE.Mesh(geo,new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide}));
}
const _bx=new THREE.Vector3(),_by=new THREE.Vector3(),_bz=new THREE.Vector3(),_bm=new THREE.Matrix4();
function placeName(mesh,dir,roll){
  _bz.copy(dir).normalize();
  _by.copy(UP).addScaledVector(_bz,-UP.dot(_bz));
  if(_by.lengthSq()<1e-6)_by.set(0,0,-1);else _by.normalize();
  _bx.crossVectors(_by,_bz).normalize();
  _bm.makeBasis(_bx,_by,_bz);
  mesh.quaternion.setFromRotationMatrix(_bm);
  mesh.rotateZ(roll);
  mesh.position.copy(_bz).multiplyScalar(NAME_R);
  globeGroup.add(mesh);
}

/* ---------- fibonacci sphere ---------- */
function fibDir(i,n){
  const y=1-(i/(n-1))*2;
  const rad=Math.sqrt(Math.max(0,1-y*y));
  const th=i*2.399963;
  return new THREE.Vector3(Math.cos(th)*rad,y,Math.sin(th)*rad);
}

/* ---------- renderer / scene ---------- */
const stage=document.getElementById('stage');
let renderer;
try{
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
}catch(e){
  document.getElementById('loading').style.display='none';
  document.getElementById('fallback').style.display='flex';
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
stage.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,400);

/* camera state: yaw/pitch = the point on the globe facing you, dist = zoom */
let yaw=0.7,pitch=0.32;
let camDist=CAM_HOME,targetDist=CAM_HOME;
let fly=null;

scene.add(new THREE.HemisphereLight(0xfff8ec,0x8a7a63,0.95));
const key=new THREE.DirectionalLight(0xfff2dd,1.5);key.position.set(8,12,10);scene.add(key);
const rim=new THREE.DirectionalLight(0xdde8ff,0.45);rim.position.set(-10,-4,-8);scene.add(rim);

const globeGroup=new THREE.Group();
globeGroup.rotation.order='YXZ';
scene.add(globeGroup);

const globe=new THREE.Mesh(
  new THREE.SphereGeometry(R,96,64),
  new THREE.MeshStandardMaterial({map:concreteTexture(),roughness:0.92,metalness:0})
);
globeGroup.add(globe);

/* soft shadow under the globe */
let shadowMat;
{
  const c=document.createElement('canvas');c.width=c.height=256;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(128,128,10,128,128,128);
  gr.addColorStop(0,'rgba(60,50,38,.30)');gr.addColorStop(1,'rgba(60,50,38,0)');
  g.fillStyle=gr;g.fillRect(0,0,256,256);
  shadowMat=new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false});
  const sh=new THREE.Mesh(new THREE.PlaneGeometry(30,30),shadowMat);
  sh.rotation.x=-Math.PI/2;sh.position.y=-R-3.4;
  scene.add(sh);
}

/* ---------- build names ---------- */
const nameIndex=new Map();
const nameMats=[];   // {mat, base} for the search spotlight dim
let glowSprite=null;
let dim=1,dimTarget=1,dimmedMat=null;
const qInput=document.getElementById('q');

function applyDim(){
  const k=0.14+0.86*dim;
  for(let i=0;i<nameMats.length;i++){
    const n=nameMats[i];
    if(n.mat===dimmedMat)n.mat.color.copy(n.base);
    else n.mat.color.copy(n.base).multiplyScalar(k);
  }
  globe.material.color.setScalar(0.22+0.78*dim);
  shadowMat.opacity=dim;
}

async function boot(){
  let users=[];
  for(let attempt=0;attempt<3 && !users.length;attempt++){
    try{
      const res=await fetch('followers.json?v='+Date.now());
      if(res.ok){
        const j=await res.json();
        users=Array.isArray(j)?j:(j.followers||[]);
      }
    }catch(e){}
    if(!users.length&&attempt<2)await new Promise(r=>setTimeout(r,800));
  }
  document.getElementById('count').textContent=users.length?users.length:'could not load';

  try{await document.fonts.load('64px "Permanent Marker"');}catch(e){}

  const r=mulberry32(1234);
  const INK='#2b2b2b';
  let s=1; // skip slot 0 (exact pole)
  users.forEach(u=>{
    const d=fibDir(s%SLOTS,SLOTS);s++;
    const mesh=makeName('@'+u.username,INK,0.72+r()*0.26);
    placeName(mesh,d,(r()-0.5)*0.06);
    nameMats.push({mat:mesh.material,base:mesh.material.color.clone()});
    nameIndex.set(u.username.toLowerCase(),{dir:d.clone(),mat:mesh.material});
  });

  document.getElementById('loading').style.display='none';
  renderer.setAnimationLoop(tick);
}

/* ---------- search ---------- */
function clearGlow(){
  if(glowSprite){globeGroup.remove(glowSprite);glowSprite=null;}
}
function find(){
  const q=qInput.value.trim().replace(/^@/,'').toLowerCase();
  if(!q)return;
  const hit=nameIndex.get(q);
  clearGlow();
  dimmedMat=null;
  if(!hit){
    dimTarget=1;
    qInput.classList.add('miss');
    qInput.value='';qInput.placeholder='not on the globe yet';
    setTimeout(()=>{qInput.classList.remove('miss');qInput.placeholder='find your name';},2200);
    return;
  }
  const d=hit.dir;
  dimmedMat=hit.mat;   // this name stays exactly as it is
  dimTarget=0;         // everything else goes dark
  const c=document.createElement('canvas');c.width=c.height=128;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(64,64,4,64,64,64);
  gr.addColorStop(0,'rgba(255,244,214,.95)');gr.addColorStop(1,'rgba(255,244,214,0)');
  g.fillStyle=gr;g.fillRect(0,0,128,128);
  const glow=new THREE.Sprite(new THREE.SpriteMaterial({
    map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));
  glow.scale.set(3.6,3.6,1);
  glow.position.copy(d).multiplyScalar(R+0.05);
  globeGroup.add(glow);
  glowSprite=glow;
  // fly the viewpoint to the name and zoom in to read it
  const pt=Math.atan2(d.y,d.z);
  const d1=d.clone().applyEuler(new THREE.Euler(pt,0,0,'YXZ'));
  const yt=Math.atan2(-d1.x,d1.z);
  let dyaw=yt-yaw;
  dyaw=Math.atan2(Math.sin(dyaw),Math.cos(dyaw));
  const pc=Math.max(-PITCH_CLAMP,Math.min(PITCH_CLAMP,pt));
  fly={yaw0:yaw,dyaw,pitch0:pitch,dpitch:pc-pitch,dist0:targetDist,ddist:17-targetDist,t:0};
}
document.getElementById('go').addEventListener('click',find);
qInput.addEventListener('keydown',e=>{if(e.key==='Enter')find();});

/* ---------- controls: grab the world, it follows your finger ---------- */
const pointers=new Map();
let pinchD0=0,pinchT0=CAM_HOME;
stage.addEventListener('pointerdown',e=>{
  stage.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){
    const p=[...pointers.values()];
    pinchD0=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);pinchT0=targetDist;
  }
  fly=null;clearGlow();dimmedMat=null;dimTarget=1;
});
stage.addEventListener('pointermove',e=>{
  const p=pointers.get(e.pointerId);
  if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;
  p.x=e.clientX;p.y=e.clientY;
  if(pointers.size===1){
    // 1:1 grab: the point under your finger follows it, scaled so close-ups track right
    const k=0.0042*(targetDist/CAM_HOME);
    yaw+=dx*k;
    pitch=Math.max(-PITCH_CLAMP,Math.min(PITCH_CLAMP,pitch+dy*k));
  }else if(pointers.size===2){
    const q=[...pointers.values()];
    const d=Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y);
    if(pinchD0>0)targetDist=Math.max(CAM_MIN,Math.min(CAM_MAX,pinchT0*pinchD0/Math.max(1,d)));
  }
});
function endPointer(e){pointers.delete(e.pointerId);}
stage.addEventListener('pointerup',endPointer);
stage.addEventListener('pointercancel',endPointer);
stage.addEventListener('wheel',e=>{
  e.preventDefault();
  targetDist=Math.max(CAM_MIN,Math.min(CAM_MAX,targetDist*(1+e.deltaY*0.0011)));
},{passive:false});

/* ---------- loop ---------- */
const easeIO=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
let prevT=performance.now();
function tick(){
  const now=performance.now();
  const dt=Math.min(0.05,(now-prevT)/1000);prevT=now;

  if(fly){
    fly.t+=dt/1.3;
    const k=easeIO(Math.min(1,fly.t));
    yaw=fly.yaw0+fly.dyaw*k;
    pitch=fly.pitch0+fly.dpitch*k;
    targetDist=fly.dist0+fly.ddist*k;
    if(fly.t>=1)fly=null;
  }
  globeGroup.rotation.set(pitch,yaw,0);
  camDist+=(targetDist-camDist)*Math.min(1,dt*7);   // buttery zoom
  if(Math.abs(dim-dimTarget)>0.001||dim!==dimTarget){
    dim+=(dimTarget-dim)*Math.min(1,dt*4);
    if(Math.abs(dim-dimTarget)<0.002)dim=dimTarget;
    applyDim();
  }
  camera.position.set(0,0,camDist);
  camera.lookAt(0,0,0);
  renderer.render(scene,camera);
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

boot().catch(()=>{
  document.getElementById('loading').style.display='none';
  document.getElementById('fallback').style.display='flex';
});
</script>
</body>
</html>
